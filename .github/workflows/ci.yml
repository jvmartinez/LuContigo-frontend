name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Formato
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas unitarias y de componentes (Vitest + MSW)
        run: npm test
      - name: Build
        run: npm run build

  # Flujos completos contra la API real con el seed (FRONTEND.md §9).
  e2e:
    runs-on: ubuntu-latest
    needs: web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medicita
          POSTGRES_PASSWORD: medicita
          POSTGRES_DB: medicita
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U medicita" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/LuContigo-backend
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: API con seed
        working-directory: backend
        run: |
          npm ci
          cp .env.example .env
          npx prisma migrate deploy
          npm run prisma:seed
          npm run build
          nohup npm start > api.log 2>&1 &
          npx wait-on -t 60000 http://localhost:3000/api/docs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            backend/api.log
